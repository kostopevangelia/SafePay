services:
  mysql:
    image: mysql:8
    container_name: mysql
    #profiles: ["localdb"]                   # μόνο στο local mode
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-payment_service}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
    ports:
      - "${MYSQL_PORT_HOST:-3307}:3306"     # host 3307 -> container 3306
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p${MYSQL_ROOT_PASSWORD:-change-me} | grep 'mysqld is alive'"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  db-migrate:
    image: flyway/flyway:10-alpine
    profiles: ["localdb"]                  
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false
      FLYWAY_USER: ${DB_USER}
      FLYWAY_PASSWORD: ${DB_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_BASELINE_ON_MIGRATE: "true"
    volumes:
      - ./db/migrations:/flyway/sql:ro

  fraud-detection:
    build:
      context: ./fraud-detection
      dockerfile: Dockerfile
    environment:
      MODEL_DIR: ${MODEL_DIR:-/app/models}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  payment-system:
    build:
      context: ./payment-system
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_FLYWAY_ENABLED: "false"    # db-migrate service
      
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_INIT_URL: ${STRIPE_INIT_URL}
      STRIPE_CONFIRM_URL: ${STRIPE_CONFIRM_URL}
      
      FRAUD_API_URL: http://fraud-detection:8000/predict-fraud
      FRAUD_API_SECRET_KEY: ${FRAUD_API_SECRET_KEY}

    ports:
      - "8080:8080"
    depends_on:
      fraud-detection:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - payment-system
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
